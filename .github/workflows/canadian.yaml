name: Canadian

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        host_arch:
          - mingw-w64
        version:
          - stable
        target:
          - x86_64-w64-mingw32

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Build
        id: build
        run: |
          sudo rm -rf /opt/x-tools
          ./scripts/make ${{ matrix.target }} ${{ matrix.version }} ${{ matrix.host_arch }}

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.FILE_NAME }}.tar.xz
          path: ${{ steps.build.outputs.FILE_NAME }}.tar.xz
          if-no-files-found: error
          retention-days: 1
      - name: Upload checksum
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.FILE_NAME }}.tar.xz.sha256
          path: ${{ steps.build.outputs.FILE_NAME }}.tar.xz.sha256
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release
          pattern: "*.tar.*"
          merge-multiple: true
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          tag_name="$(date +%Y%m%d)"
          echo "tag_name=${tag_name}" >> $GITHUB_ENV
          if gh release view "${tag_name}" > /dev/null 2>&1; then
            echo "Release ${tag_name} already exists, skipping creation."
          else
            echo "Creating release ${tag_name}..."
            gh release create "${tag_name}" --title "${tag_name}" --generate-notes
          fi
      - name: Generate checksums
        run: |
          echo "**Supported targets**: [${{ env.tag_name }}](https://github.com/${{ github.repository }}/tree/${{ env.tag_name }}#supported-targets)" > RELEASE.md
          sed -n '/## Supported targets/,/### Note/{ /## Supported targets/b; /### Note/b; p; }' README.md >> RELEASE.md
      - name: Upload artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in release/*.tar.xz; do
            [ -e "$i" ] || continue
            gh release upload ${{ env.tag_name }} "$i" --clobber
          done
          gh release edit ${{ env.tag_name }} -F RELEASE.md
